# Configuration Alembic. L'URL de connexion est injectée dans env.py depuis DATABASE_URL.
[alembic]
script_location = database/alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url : volontairement vide ici -> lue depuis l'environnement dans env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
