# Stack local-first. Les valeurs par défaut fonctionnent sans .env ;
# un .env (cp .env.example .env) permet de surcharger via substitution ${VAR:-defaut}.
name: reif

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reif}
      POSTGRES_DB: ${POSTGRES_DB:-reif}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reif} -d ${POSTGRES_DB:-reif}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: .
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://reif:reif@db:5432/reif}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./:/app
    restart: unless-stopped

  worker:
    build: .
    command: python -m backend.app.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://reif:reif@db:5432/reif}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - dvfdata:/app/data
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      API_URL: ${API_URL:-http://api:8000}
    depends_on:
      - api
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ./:/app
    restart: unless-stopped

  # Outil d'inspection SQL, uniquement en dev :  docker compose --profile dev up adminer
  adminer:
    image: adminer:4
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db
    profiles: ["dev"]
    restart: unless-stopped

volumes:
  pgdata:
  dvfdata:
