name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aucun scraping en CI (§12) : uniquement lint, tests sur fixtures locales, et validation des migrations.
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: reif
          POSTGRES_PASSWORD: reif
          POSTGRES_DB: reif
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reif -d reif"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://reif:reif@localhost:5432/reif
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Validate migrations (alembic upgrade head)
        run: uv run alembic -c database/alembic.ini upgrade head

      - name: Tests
        run: uv run pytest
